name: "json-inspector"
arch: ${GOARCH}
platform: "linux"
version: "0.1.2"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Inspect JSON with environment variables, schema mapping, and browser request interception."
vendor: "Yuri Gerasimov"
homepage: "https://github.com/Jurager/json-inspector"
license: "MIT"
release: "1"

contents:
  - src: "./bin/json-inspector"
    dst: "/usr/local/bin/json-inspector"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/json-inspector.png"
  - src: "./build/linux/json-inspector.desktop"
    dst: "/usr/share/applications/json-inspector.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"