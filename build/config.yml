version: '3'

info:
  companyName: "Yuri Gerasimov"
  productName: "JSON Inspector"
  productIdentifier: "com.jurager.json-inspector"
  description: "Inspect JSON with environment variables, schema mapping, and browser request interception."
  copyright: "© 2026, Yuri Gerasimov"
  comments: "JSON Inspector"
  version: "0.1.2"

protocols:
  - scheme: json-inspector
    description: JSON Inspector Protocol

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
