version: '3'

vars:
  APP_NAME: json-inspector
  BIN_DIR: bin
  APP_PATH: '{{.BIN_DIR}}/{{.APP_NAME}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  VERSION: '{{.VERSION | default "dev"}}'

  PRODUCT_NAME: "JSON Inspector"
  PRODUCT_DESCRIPTION: "Inspect JSON with environment variables, schema mapping, and browser request interception."

  LDFLAGS: '-w -s -X main.version={{.VERSION}}'
  BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}}"{{end}}'

tasks:
  # ─── Public ───────────────────────────────────────────────────────────────

  build:
    desc: Build the app for the current OS
    cmds:
      - task: darwin:build
        platforms: [darwin]
      - task: linux:build
        platforms: [linux]
      - task: windows:build
        platforms: [windows]

  run:
    desc: Run the built app
    cmds:
      - task: darwin:run
        platforms: [darwin]
      - task: linux:run
        platforms: [linux]
      - task: windows:run
        platforms: [windows]

  dev:
    desc: Run the app in dev mode, rebuilding on every change
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  package:
    desc: Package a release build for the current OS
    cmds:
      - task: darwin:package
        platforms: [darwin]
      - task: linux:package
        platforms: [linux]
      - task: windows:package
        platforms: [windows]

  verify:
    desc: Check that go.mod and frontend/package.json pin the same Wails version
    cmds:
      - |
        set -euo pipefail
        GO_VER=$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')
        NPM_VER=$(node -p "require('./frontend/package.json').dependencies['@wailsio/runtime']")
        GO_VER=${GO_VER#v}
        NPM_VER=${NPM_VER#v}
        if [ "$GO_VER" != "$NPM_VER" ]; then
          echo "Wails version mismatch:"
          echo "  go.mod                  $GO_VER"
          echo "  frontend/package.json   $NPM_VER"
          echo ""
          echo "They must match: the Go library and the JS runtime speak one IPC"
          echo "protocol, and a mismatch shows up as a blank window, not an error."
          exit 1
        fi
        echo "Wails version OK: $GO_VER"

  set:version:
    desc: Stamp the release version into the files the packagers read
    cmds:
      - go run ./internal/tools/stamp -version {{.VERSION}}

  clean:
    desc: Remove all build output
    cmds:
      - rm -rf dist bin .task
      - rm -f build/linux/*.desktop

  # ─── Frontend ─────────────────────────────────────────────────────────────

  install:frontend:deps:
    desc: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm not found"
    cmds:
      - npm install

  build:frontend:
    desc: Build the frontend
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    desc: Run the Vite dev server
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev

  # ─── Generation ───────────────────────────────────────────────────────────

  go:mod:tidy:
    desc: Run `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  generate:bindings:
    desc: Generate the TypeScript bindings the frontend imports
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - frontend/bindings/**/*
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -clean=true -ts -i

  generate:icons:
    desc: Generate app icons from build/appicon.png
    run: once
    dir: build
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
      - windows/icon.ico
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  # ─── macOS ────────────────────────────────────────────────────────────────

  darwin:build:
    desc: Build the macOS binary
    platforms: [darwin]
    deps:
      - task: go:mod:tidy
      - task: build:frontend
      - task: generate:icons
    cmds:
      - 'go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      OUTPUT: '{{.OUTPUT | default .APP_PATH}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  darwin:build:universal:
    desc: Build arm64 and amd64 binaries and lipo them into one universal binary
    platforms: [darwin]
    deps:
      - task: darwin:build
        vars:
          ARCH: amd64
          OUTPUT: '{{.APP_PATH}}-amd64'
      - task: darwin:build
        vars:
          ARCH: arm64
          OUTPUT: '{{.APP_PATH}}-arm64'
    cmds:
      - lipo -create -output "{{.APP_PATH}}" "{{.APP_PATH}}-amd64" "{{.APP_PATH}}-arm64"
      - rm -f "{{.APP_PATH}}-amd64" "{{.APP_PATH}}-arm64"

  darwin:bundle:
    desc: Assemble a .app bundle around the built binary
    internal: true
    platforms: [darwin]
    vars:
      APP_DIR: '{{.BIN_DIR}}/{{.APP_NAME}}{{.SUFFIX}}.app'
    cmds:
      - mkdir -p "{{.APP_DIR}}/Contents/MacOS"
      - mkdir -p "{{.APP_DIR}}/Contents/Resources"
      - cp build/darwin/icons.icns "{{.APP_DIR}}/Contents/Resources"
      - cp "{{.APP_PATH}}" "{{.APP_DIR}}/Contents/MacOS"
      - cp "{{.INFO_PLIST}}" "{{.APP_DIR}}/Contents/Info.plist"

  darwin:package:
    desc: Package the macOS app — codesign, zip, and dmg — into dist/
    platforms: [darwin]
    deps:
      - task: darwin:build:universal
    cmds:
      - task: darwin:bundle
        vars:
          SUFFIX: ""
          INFO_PLIST: build/darwin/Info.plist
      - codesign --force --deep --sign "{{.CODE_SIGN_IDENTITY}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p dist
      - cd {{.BIN_DIR}} && ditto -c -k --keepParent "{{.APP_NAME}}.app" "../dist/{{.APP_NAME}}-darwin-arm64.app.zip"
      - cp "dist/{{.APP_NAME}}-darwin-arm64.app.zip" "dist/{{.APP_NAME}}-darwin-amd64.app.zip"
      - task: darwin:dmg
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}.dmg" "dist/{{.APP_NAME}}-darwin-universal.dmg"
      - ls -la dist
    vars:
      CODE_SIGN_IDENTITY: '{{.CODE_SIGN_IDENTITY | default "-"}}'

  darwin:dmg:
    desc: Create a .dmg from the app bundle
    internal: true
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.APP_NAME}}" --out "{{.BIN_DIR}}"
        --volume-icon "build/darwin/icons.icns" --window-width 540 --window-height 380

  darwin:run:
    desc: Wrap the binary in a .dev.app bundle and launch it
    platforms: [darwin]
    deps:
      - task: darwin:bundle
        vars:
          SUFFIX: ".dev"
          INFO_PLIST: build/darwin/Info.dev.plist
    cmds:
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  # ─── Linux ────────────────────────────────────────────────────────────────

  linux:build:
    desc: Build the Linux binary
    platforms: [linux]
    run: once
    deps:
      - task: go:mod:tidy
      - task: build:frontend
      - task: generate:icons
    cmds:
      - 'go build {{.BUILD_FLAGS}} -o "{{.APP_PATH}}"'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  linux:dotdesktop:
    desc: Generate build/linux/json-inspector.desktop
    internal: true
    platforms: [linux]
    run: once
    dir: build
    cmds:
      - >-
        wails3 generate .desktop -name "{{.PRODUCT_NAME}}"
        -comment "{{.PRODUCT_DESCRIPTION}}"
        -exec "{{.APP_NAME}} %u"
        -icon "{{.APP_NAME}}"
        -keywords ""
        -categories "Development;"
        -mimetype "x-scheme-handler/json-inspector;"
        -outputfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop"

  linux:package:
    desc: Package the Linux artifacts — .tar.gz, .deb, .rpm, .AppImage — into dist/
    platforms: [linux]
    deps:
      - task: linux:build
      - task: linux:dotdesktop
    cmds:
      - mkdir -p dist
      - cd {{.BIN_DIR}} && tar -czf "../dist/{{.APP_NAME}}-linux-{{.ARCH | default ARCH}}.tar.gz" "{{.APP_NAME}}"
      - task: linux:nfpm
        vars:
          FORMAT: deb
      - task: linux:nfpm
        vars:
          FORMAT: rpm
      - task: linux:appimage
      - cp {{.BIN_DIR}}/*.deb {{.BIN_DIR}}/*.rpm {{.BIN_DIR}}/*.AppImage dist/
      - ls -la dist

  linux:nfpm:
    desc: Create a .deb or .rpm package via nfpm
    internal: true
    platforms: [linux]
    deps:
      - task: linux:build
      - task: linux:dotdesktop
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format {{.FORMAT}} -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/{{.BIN_DIR}}

  linux:appimage:
    desc: Create an AppImage
    platforms: [linux]
    deps:
      - task: linux:build
      - task: linux:dotdesktop
    cmds:
      - cp build/appicon.png {{.APP_PATH}}.png
      - >-
        wails3 generate appimage -binary "{{.ROOT_DIR}}/{{.APP_PATH}}"
        -icon "{{.ROOT_DIR}}/{{.APP_PATH}}.png"
        -desktopfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop"
        -outputdir "{{.ROOT_DIR}}/{{.BIN_DIR}}"

  linux:run:
    desc: Run the built binary
    platforms: [linux]
    cmds:
      - '{{.APP_PATH}}'

  # ─── Windows ──────────────────────────────────────────────────────────────

  windows:build:
    desc: Build the Windows executable into bin/
    platforms: [windows]
    deps:
      - task: go:mod:tidy
      - task: build:frontend
      - task: generate:icons
    cmds:
      - task: windows:syso
      - 'go build {{.BUILD_FLAGS}} -o "{{.APP_PATH}}.exe"'
      - rm -f wails_windows_*.syso
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}} -H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  windows:syso:
    desc: Generate the .syso carrying the icon, manifest, and version info
    internal: true
    platforms: [windows]
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH | default ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH | default ARCH}}.syso

  windows:package:
    desc: Package the Windows artifacts — .exe.zip and installer — into dist/
    platforms: [windows]
    deps:
      - task: windows:build
    cmds:
      - task: windows:nsis
      - mkdir -p dist
      - >-
        powershell -Command "Compress-Archive -Path '{{.APP_PATH}}.exe'
        -DestinationPath 'dist/{{.APP_NAME}}-windows-{{.ARCH | default ARCH}}.exe.zip' -Force"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH | default ARCH}}-installer.exe" "dist/{{.APP_NAME}}-windows-{{.ARCH | default ARCH}}-installer.exe"
      - ls -la dist

  windows:nsis:
    desc: Create the NSIS installer, which also registers json-inspector://
    internal: true
    platforms: [windows]
    dir: build/windows/nsis
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - >-
        makensis -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user
        -DARG_WAILS_{{if eq (.ARCH | default ARCH) "amd64"}}AMD64{{else}}ARM64{{end}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe"
        project.nsi

  windows:run:
    desc: Run the built executable
    platforms: [windows]
    cmds:
      - '{{.APP_PATH}}.exe'