<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>json-inspector</title>
    <script>
      ;(function () {
        try {
          // The theme travels on the window's URL: Go knows it before the window exists, and this
          // runs before the first frame — an IPC call is always too late for that.
          var asked = new URLSearchParams(location.search).get('theme')
          // localStorage is only a cache, for a dev reload that carries no query string.
          var stored = asked || localStorage.getItem('ji-theme-v1')
          var followsSystem = !stored || stored === 'system'
          var dark =
            stored === 'dark' || (followsSystem && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')

          // The same query says whether this window has a material behind it. A window that has one
          // must not paint its own ground, or the desktop would stop at the edge of the chrome; the
          // About window loads this same stylesheet and has no material, so it keeps the ground.
          if (new URLSearchParams(location.search).get('translucent') === '1') {
            document.documentElement.classList.add('window-translucent')
          }
        } catch {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
