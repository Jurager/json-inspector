<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Settings</title>
    <script>
      ;(function () {
        try {
          // The theme travels on the window's URL: Go knows it before the window exists, and this
          // runs before the first frame — an IPC call is always too late for that.
          var asked = new URLSearchParams(location.search).get('theme')
          // localStorage is only a cache, for a dev reload that carries no query string.
          var stored = asked || localStorage.getItem('ji-theme-v1')
          var followsSystem = !stored || stored === 'system'
          var dark =
            stored === 'dark' || (followsSystem && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')

          // The language travels the same road and for the same reason: the first frame is already
          // written in one, and both catalogues are in the bundle. "system" is resolved here, because
          // the webview is the only side that can ask.
          var askedLang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('ji-lang-v1')
          document.documentElement.lang =
            askedLang === 'ru' || askedLang === 'en'
              ? askedLang
              : navigator.language.toLowerCase().indexOf('ru') === 0
                ? 'ru'
                : 'en'
        } catch {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
</head>
<body>
<div id="app"></div>
<script src="./src/windows/settings.ts" type="module"></script>
</body>
</html>
