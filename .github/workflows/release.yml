name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TASK_VERSION: v3.53.1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve the Wails version
        run: echo "WAILS_VERSION=$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('go.mod') }}
      - name: Install Wails
        run: |
          command -v wails3 >/dev/null || go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          command -v task   >/dev/null || go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - name: Sync product version from the tag
        run: |
          sed -i '' "s/^  version: .*/  version: \"${GITHUB_REF_NAME#v}\"/" build/config.yml
      - name: Build
        run: make package-darwin VERSION="${GITHUB_REF_NAME}"
        env:
          CODE_SIGN_IDENTITY: '-'
      - uses: actions/upload-artifact@v6
        with:
          name: dist-macos
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve the Wails version
        run: echo "WAILS_VERSION=$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('go.mod') }}
      - name: Install GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install Wails v3 CLI and Task
        run: |
          command -v wails3 >/dev/null || go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          command -v task   >/dev/null || go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - name: Sync product version from the tag
        run: |
          sed -i "s/^  version: .*/  version: \"${GITHUB_REF_NAME#v}\"/" build/config.yml
      - name: Build
        run: make package-linux VERSION="${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve the Wails version
        run: echo "WAILS_VERSION=$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')" >> $GITHUB_ENV
        shell: bash
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('go.mod') }}
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
        shell: bash
      - name: Install Wails
        run: |
          command -v wails3 >/dev/null || go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          command -v task   >/dev/null || go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
        shell: bash
      - name: Sync product version
        run: |
          sed -i "s/^  version: .*/  version: \"${GITHUB_REF_NAME#v}\"/" build/config.yml
        shell: bash
      - name: Build
        run: make package-windows VERSION="${GITHUB_REF_NAME}"
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: dist/

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
