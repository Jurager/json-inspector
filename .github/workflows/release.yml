name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Sync the version from the tag
        run: task set:version VERSION="${GITHUB_REF_NAME#v}"
      - run: task darwin:package VERSION="${GITHUB_REF_NAME}"
        env:
          # Unsigned: there is no Developer ID certificate for this project yet.
          CODE_SIGN_IDENTITY: '-'
      - uses: actions/upload-artifact@v6
        with:
          name: dist-macos
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Sync the version from the tag
        run: task set:version VERSION="${GITHUB_REF_NAME#v}"
      - run: task linux:package VERSION="${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux
          path: dist/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
      - name: Sync the version from the tag
        run: task set:version VERSION="${GITHUB_REF_NAME#v}"
      - run: task windows:package VERSION="${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: dist/

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
