name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TASK_VERSION: v3.53.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - name: Check the Wails version pins agree
        run: task common:verify:wails:version
      - name: Check generated files match their sources
        # frontend/src/product.json is projected out of build/config.yml and
        # committed; this fails if the two have drifted apart.
        run: task common:verify:generated
      - name: Verify and test
        run: |
          go vet ./...
          go test ./...

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve the Wails version
        run: echo "WAILS_VERSION=$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('go.mod') }}
      - name: Install GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install Wails
        run: |
          command -v wails3 >/dev/null || go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          command -v task   >/dev/null || go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - run: task build

  build-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve the Wails version
        run: echo "WAILS_VERSION=$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('go.mod') }}
      - name: Install Wails
        run: |
          command -v wails3 >/dev/null || go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          command -v task   >/dev/null || go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - run: task build

  build-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve the Wails version
        run: echo "WAILS_VERSION=$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')" >> $GITHUB_ENV
        shell: bash
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('go.mod') }}
      - name: Install Wails
        run: |
          command -v wails3 >/dev/null || go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          command -v task   >/dev/null || go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
        shell: bash
      - run: task build
        shell: bash